    <path d="M 215,140 C 235,115 270,95 305,95 C 315,95 320,105 315,115 C 290,135 250,155 215,160 Z" />
    <path d="M 305,95 C 330,80 348,65 352,65 C 354,72 342,95 325,112 C 345,122 355,138 350,142 C 342,142 322,130 308,118 Z" opacity="0.8" />

