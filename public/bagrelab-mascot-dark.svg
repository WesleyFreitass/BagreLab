      <path d="M 180,280 C 174,298 165,318 152,330" />
      <path d="M 220,280 C 226,298 235,318 248,330" />
      <path d="M 240,270 C 250,285 262,300 272,308" />
    </g>

    <!-- 2 Grandes Barbilhões Laterais -->
    <g stroke="#221E1B" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M 140,225 C 100,250 65,280 50,265 C 32,248 45,190 78,162 C 92,150 108,145 110,148" />
      <path d="M 260,225 C 300,250 335,280 350,265 C 368,248 355,190 322,162 C 308,150 292,145 290,148" />
