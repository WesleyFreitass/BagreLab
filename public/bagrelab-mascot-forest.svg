<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- BAGRELAB - Mascote Oficial em Paleta Verde Floresta / Kraft (100% Vetorial Sem Fundo) -->
  
  <g id="bagrelab-mascot-forest">
    <!-- 1. CAUDA NO FUNDO -->
    <g id="tail-background">
      <path d="M 215,140 C 235,115 270,95 305,95 C 315,95 320,105 315,115 C 290,135 250,155 215,160 Z" fill="#1E3E24" />
      <path d="M 245,130 C 270,110 300,100 325,102 C 322,118 290,140 250,155 Z" fill="#DFD6C5" />
      <path d="M 305,95 C 330,80 348,65 352,65 C 354,72 342,95 325,112 C 345,122 355,138 350,142 C 342,142 322,130 308,118 Z" fill="#DFD6C5" />
      <path d="M 305,95 C 320,85 338,72 345,70 C 338,88 322,105 310,112 Z" fill="#1E3E24" />
    </g>

    <!-- 2. BARBATANA DORSAL SUPERIOR -->
    <g id="dorsal-fin">
      <path d="M 190,150 L 200,45 L 200,145 Z" fill="#2E5B37" />
      <path d="M 200,45 L 210,150 L 200,145 Z" fill="#1E3E24" />
      <path d="M 190,150 L 200,45 L 210,150" stroke="#221E1B" stroke-width="2.5" stroke-linejoin="round" />
    </g>

    <!-- 3. BARBATANAS PEITORAIS -->
    <g id="pectoral-fins">
      <path d="M 130,215 C 105,215 80,222 72,228 C 76,234 105,236 132,234 Z" fill="#DFD6C5" stroke="#221E1B" stroke-width="2" />
      <path d="M 270,215 C 295,215 320,222 328,228 C 324,234 295,236 268,234 Z" fill="#C6B193" stroke="#221E1B" stroke-width="2" />
    </g>

    <!-- 4. CABEÇA PRINCIPAL -->
    <g id="head-main">
      <path d="M 200,115 C 165,120 130,160 124,225 C 124,235 160,250 200,250 L 200,115 Z" fill="#2E5B37" />
      <path d="M 200,115 C 235,120 270,160 276,225 C 276,235 240,250 200,250 L 200,115 Z" fill="#1E3E24" />
      <path d="M 124,225 C 130,160 165,120 200,115 C 235,120 270,160 276,225" stroke="#221E1B" stroke-width="3" stroke-linecap="round" />
      <line x1="200" y1="115" x2="200" y2="250" stroke="#221E1B" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- 5. OLHOS -->
    <g id="eyes">
      <ellipse cx="152" cy="202" rx="6.5" ry="9" fill="#221E1B" />
      <ellipse cx="248" cy="202" rx="6.5" ry="9" fill="#221E1B" />
    </g>

    <!-- 6. BARRIGA / QUEIXO KRAFT -->
    <g id="underbelly">
      <path d="M 200,240 C 170,240 144,232 136,228 C 144,265 170,285 200,285 L 200,240 Z" fill="#DFD6C5" />
      <path d="M 200,240 C 230,240 256,232 264,228 C 256,265 230,285 200,285 L 200,240 Z" fill="#C6B193" />
      <path d="M 136,228 C 144,265 170,285 200,285 C 230,285 256,265 264,228" stroke="#221E1B" stroke-width="2.5" />
      <path d="M 132,230 C 160,246 240,246 268,230" stroke="#221E1B" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 7. BARBILHÕES INFERIORES -->
    <g id="chin-whiskers" stroke="#DFD6C5" stroke-width="4.5" stroke-linecap="round" fill="none">
      <path d="M 160,270 C 150,285 138,300 128,308" />
      <path d="M 180,280 C 174,298 165,318 152,330" />
      <path d="M 220,280 C 226,298 235,318 248,330" stroke="#C6B193" />
      <path d="M 240,270 C 250,285 262,300 272,308" stroke="#C6B193" />
    </g>

    <!-- 8. GRANDES BARBILHÕES PRINCIPAIS -->
    <g id="main-whiskers" fill="none" stroke="#1E3E24" stroke-width="5" stroke-linecap="round">
      <path d="M 140,225 C 100,250 65,280 50,265 C 32,248 45,190 78,162 C 92,150 108,145 110,148" />
      <path d="M 260,225 C 300,250 335,280 350,265 C 368,248 355,190 322,162 C 308,150 292,145 290,148" />
    </g>
  </g>
</svg>
