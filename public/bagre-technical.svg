<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none">
  <!-- BAGRELAB - Peixe Bagre Estilo Técnico / FDM Blueprint (Verde Floresta #1E3E24) -->
  <g stroke="#1E3E24" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Contorno do corpo do bagre -->
    <path d="M 25,62 C 14,68 8,76 10,84 C 15,84 24,76 32,68 C 60,54 100,44 140,46 C 168,48 184,52 192,44 C 194,38 188,32 174,32 C 144,34 104,36 68,42 C 45,46 32,56 25,62 Z" />
    
    <!-- Linhas de camadas de fatiamento 3D (Layer Lines no interior) -->
    <line x1="55" y1="44" x2="165" y2="40" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.6" />
    <line x1="45" y1="48" x2="175" y2="44" stroke-width="0.75" opacity="0.8" />
    <line x1="40" y1="52" x2="182" y2="47" stroke-width="0.75" stroke-dasharray="3 2" opacity="0.6" />
    <line x1="35" y1="56" x2="160" y2="52" stroke-width="0.75" opacity="0.8" />
    <line x1="30" y1="60" x2="135" y2="56" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6" />

    <!-- Barbatana dorsal técnica -->
    <polygon points="98,36 108,12 116,22 108,36" fill="#1E3E24" fill-opacity="0.1" />
    
    <!-- Cauda técnica com nervuras -->
    <path d="M 10,84 C 4,92 2,98 6,98 C 12,96 20,86 26,74" />
    <path d="M 12,84 L 18,92" stroke-width="0.75" />
    <path d="M 16,80 L 22,86" stroke-width="0.75" />

    <!-- Barbatana peitoral -->
    <polygon points="146,47 132,76 142,74 152,50" fill="#1E3E24" fill-opacity="0.1" />

    <!-- Olho CAD com retículo -->
    <circle cx="178" cy="38" r="3" />
    <circle cx="178" cy="38" r="1.2" fill="#1E3E24" />

    <!-- Bigodes / Barbilhões Técnicos (Duplos, elegantes e fluidos) -->
    <path d="M 188,36 C 180,26 160,16 138,12 C 120,8 105,10 95,14" stroke-width="1.5" />
    <path d="M 186,42 C 176,50 156,58 135,62 C 120,65 105,64 96,62" stroke-width="1.2" />
    <!-- Barbilhão menor inferior -->
    <path d="M 180,44 C 172,50 162,54 150,56" stroke-width="0.9" />
  </g>
</svg>
