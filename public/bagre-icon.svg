    <!-- Barbatana Dorsal Superior -->
    <path d="M 95,38 C 98,24 105,14 112,8 C 114,14 112,25 106,37 Z" />
    
    <!-- Barbatana Peitoral Inferior -->
    <path d="M 145,49 C 140,62 134,74 126,82 C 132,78 142,66 150,52 Z" />

