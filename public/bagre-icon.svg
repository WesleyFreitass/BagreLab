<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none">
  <!-- BAGRELAB - Silhueta do Peixe Bagre (Catfish) 100% Vetorial Sem Fundo -->
  <g fill="#221E1B">
    <!-- Corpo Principal do Bagre -->
    <path d="M 35,48 C 30,50 20,53 14,58 C 10,61 8,66 12,68 C 18,70 28,68 38,62 C 55,52 85,46 115,47 C 145,48 165,55 180,50 C 185,48 190,44 192,38 C 190,32 182,30 172,32 C 150,36 120,38 90,38 C 60,38 42,45 35,48 Z" />
    
    <!-- Cauda / Barbatana Caudal (Bifurcada e elegante) -->
