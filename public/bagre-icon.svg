    <circle cx="178" cy="38" r="2.5" fill="#FAF8F5" />
    <circle cx="178.5" cy="38" r="1.2" fill="#221E1B" />

    <!-- Bigodes / Barbilhões Característicos do Bagre (Par Superior e Inferior) -->
