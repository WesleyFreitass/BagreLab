version: '3.8'

services:
  bagrelab-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bagrelab-app
    restart: always
    ports:
      - "${HOST_PORT:-3070}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://host.docker.internal:27017/bagrelab}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
