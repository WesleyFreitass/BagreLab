services:
  bagrelab-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bagrelab-app
    restart: always
    ports:
      - "${HOST_PORT:-3140}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://pampoboard-mongodb:27017/bagrelab}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    networks:
      - default
      - pampoboard_default

networks:
  pampoboard_default:
    external: true
